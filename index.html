<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamai</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>💰 Kamai</h1><p>Earn • Complete • Withdraw</p></header><main>
<section id="auth"><div class="card"><h2 id="authTitle">Create account</h2><input id="name" placeholder="Name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><button id="authBtn">Register</button><button id="switchAuth" class="secondary">I already have an account</button><p id="msg"></p></div></section>
<section id="dashboard" hidden><section class="balance"><small>Available Coins</small><strong id="balance">0</strong></section><p id="welcome"></p><section><h2>Tasks</h2><div id="tasks">Loading...</div></section><section><h2>Wallet</h2><p>Wallet balance is stored on the backend, not only on this phone.</p><button id="withdraw">Request Withdrawal</button></section><section><h2>Account</h2><button id="logout" class="secondary">Logout</button></section></section>
</main><footer>Kamai • Build 3</footer></div><script src="app.js"></script></body></html>
